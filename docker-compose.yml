services:
  nestjs:
    build: .
    container_name: nestjs_app
    restart: always
    volumes:
      - .:/app
      - /usr/src/app/node_modules
    ports:
      - "${NESTJS_PORT}:3000"
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_started
      logto:
        condition: service_healthy
  logto:
    depends_on:
      postgres:
        condition: service_healthy
    image: svhd/logto:${LOGTO_TAG}
    container_name: logto
    entrypoint: ["sh", "-c", "npm run cli db seed -- --swe && npm start"]
    ports:
      - "${LOGTO_PORT}:3001"
      - "${LOGTO_ADMIN_PORT}:3002"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3001/oidc/.well-known/openid-configuration || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    environment:
      - TRUST_PROXY_HEADER=1
      - DB_URL=postgres://${LOGTO_DB_USER}:${LOGTO_DB_PASSWORD}@postgres:5432/${LOGTO_DB_NAME}
      - ${LOGTO_ENDPOINT}
      - ${LOGTO_ADMIN_ENDPOINT}
    volumes:
      - logto_data:/data/db

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    user: postgres
    environment:
      POSTGRES_USER: ${LOGTO_DB_USER}
      POSTGRES_PASSWORD: ${LOGTO_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgre_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:8
    container_name: mongodb
    restart: always
    ports:
      - "${MONGO_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongodb_data:/data/db

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    restart: always
    ports:
      - 1025:1025
      - 8025:8025
    volumes:
      - mailhog:/data/db


volumes:
  mongodb_data:
  logto_data:
  postgre_data:
  mailhog:

networks:
  app_network:
    driver: bridge
